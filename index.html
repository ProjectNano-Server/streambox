<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NanoTube TV</title>

<style>

:root{
    --bg:#09090b;
    --panel:#15161a;
    --panel2:#1d1f26;
    --border:#2d313b;
    --text:#f3f4f6;
    --sub:#9ca3af;
    --accent:#ff2d55;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,Arial,sans-serif;
}

body{
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
}

#bg{
    position:fixed;
    inset:0;

    background:
        radial-gradient(circle at top left,
        rgba(255,45,85,0.10),
        transparent 25%),

        linear-gradient(to bottom,
        #0d0d11,
        #09090b);

    z-index:-1;
}

#topbar{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:88px;

    display:flex;
    align-items:center;

    padding:0 32px;

    background:rgba(10,10,12,0.75);

    backdrop-filter:blur(18px);

    border-bottom:
        1px solid rgba(255,255,255,0.05);

    z-index:20;
}

#logo{
    font-size:34px;
    font-weight:700;
}

#search{
    margin-left:34px;

    width:460px;
    height:52px;

    border:none;
    outline:none;

    border-radius:18px;

    background:var(--panel);

    border:1px solid var(--border);

    color:white;

    padding:0 18px;

    font-size:18px;
}

#clock{
    margin-left:auto;
    color:var(--sub);
    font-size:22px;
}

#content{
    position:absolute;

    top:110px;
    left:32px;
    right:32px;
    bottom:32px;

    overflow:auto;
}

.sectionTitle{
    font-size:32px;
    font-weight:700;
    margin-bottom:24px;
}

#videos{
    display:grid;
    grid-template-columns:
        repeat(auto-fill,minmax(340px,1fr));

    gap:22px;
}

.video{
    background:var(--panel);

    border-radius:24px;

    overflow:hidden;

    border:2px solid transparent;

    transition:
        transform 0.12s ease,
        border 0.12s ease,
        box-shadow 0.12s ease;
}

.video.selected{
    transform:scale(1.03);

    border:2px solid var(--accent);

    box-shadow:
        0 0 0 2px rgba(255,45,85,0.12),
        0 18px 40px rgba(0,0,0,0.45);
}

.thumb{
    width:100%;
    aspect-ratio:16/9;

    background-size:cover;
    background-position:center;
}

.videoInfo{
    padding:18px;
}

.videoTitle{
    font-size:22px;
    font-weight:650;
    line-height:1.3;
}

.videoMeta{
    margin-top:10px;
    color:var(--sub);
    font-size:15px;
}

#playerScreen{
    position:fixed;
    inset:0;

    background:black;

    display:none;
    flex-direction:column;

    z-index:100;
}

#playerTop{
    height:70px;

    display:flex;
    align-items:center;

    padding:0 24px;

    background:rgba(0,0,0,0.7);

    color:white;

    font-size:22px;
}

#player{
    flex:1;
    width:100%;
    border:none;
}

#bottom{
    position:fixed;

    left:50%;
    bottom:18px;

    transform:translateX(-50%);

    padding:12px 22px;

    border-radius:18px;

    background:rgba(20,20,24,0.78);

    border:1px solid var(--border);

    color:var(--sub);

    font-size:15px;
}

::-webkit-scrollbar{
    width:10px;
}

::-webkit-scrollbar-thumb{
    background:#30323b;
    border-radius:999px;
}

</style>
</head>
<body>

<div id="bg"></div>

<div id="playerScreen">

    <div id="playerTop">
        ⬅ Back
    </div>

    <iframe
        id="player"
        allowfullscreen
        allow="autoplay"
    ></iframe>

</div>

<div id="topbar">

    <div id="logo">
        NanoTube TV
    </div>

    <input
        id="search"
        placeholder="Search YouTube"
    >

    <div id="clock">
        00:00
    </div>

</div>

<div id="content">

    <div class="sectionTitle">
        Recommended Videos
    </div>

    <div id="videos"></div>

</div>

<div id="bottom">
    MiBox Kumandası • Arrow Keys • Enter • Backspace
</div>

<script>

const API_KEY = "AIzaSyAvu8gU-dVBFRjy5x7QntgKA5YT2XNAITg";

const videosContainer =
    document.getElementById("videos");

let videos = [];
let selectedIndex = 0;

/* =========================
   CLOCK
========================= */

function updateClock(){

    const now = new Date();

    const h =
        String(now.getHours())
        .padStart(2,"0");

    const m =
        String(now.getMinutes())
        .padStart(2,"0");

    document.getElementById("clock")
        .innerText = h + ":" + m;
}

setInterval(updateClock,1000);
updateClock();

/* =========================
   LOAD VIDEOS
========================= */

async function loadTrending(){

    const url =
`https://www.googleapis.com/youtube/v3/videos?part=snippet&chart=mostPopular&maxResults=20&regionCode=TR&key=${API_KEY}`;

    const response = await fetch(url);

    const data = await response.json();

    renderVideos(data.items);
}

async function searchVideos(query){

    const url =
`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=20&type=video&q=${encodeURIComponent(query)}&key=${API_KEY}`;

    const response = await fetch(url);

    const data = await response.json();

    renderVideos(data.items,true);
}

/* =========================
   RENDER
========================= */

function renderVideos(items,isSearch=false){

    videosContainer.innerHTML = "";

    items.forEach(item => {

        const videoId = isSearch
            ? item.id.videoId
            : item.id;

        const title = item.snippet.title;

        const channel =
            item.snippet.channelTitle;

        const thumb =
            item.snippet.thumbnails.high.url;

        const card =
            document.createElement("div");

        card.className = "video";

        card.dataset.videoId = videoId;

        card.innerHTML = `

            <div class="thumb"
            style="background-image:url('${thumb}')">
            </div>

            <div class="videoInfo">

                <div class="videoTitle">
                    ${title}
                </div>

                <div class="videoMeta">
                    ${channel}
                </div>

            </div>
        `;

        videosContainer.appendChild(card);
    });

    videos =
        [...document.querySelectorAll(".video")];

    selectedIndex = 0;

    updateSelection();
}

/* =========================
   SELECTION
========================= */

function updateSelection(){

    videos.forEach(v => {
        v.classList.remove("selected");
    });

    if(videos[selectedIndex]){

        videos[selectedIndex]
            .classList.add("selected");

        videos[selectedIndex]
            .scrollIntoView({
                behavior:"smooth",
                block:"center"
            });
    }
}

/* =========================
   PLAYER
========================= */

const playerScreen =
    document.getElementById("playerScreen");

const player =
    document.getElementById("player");

function openVideo(){

    const id =
        videos[selectedIndex]
        .dataset.videoId;

    player.src =
`https://www.youtube.com/embed/${id}?autoplay=1`;

    playerScreen.style.display = "flex";
}

function closeVideo(){

    player.src = "";

    playerScreen.style.display = "none";
}

/* =========================
   SEARCH
========================= */

document
.getElementById("search")
.addEventListener("keydown",e=>{

    if(e.key === "Enter"){

        searchVideos(e.target.value);
    }
});

/* =========================
   REMOTE SUPPORT
========================= */

document.addEventListener("keydown",e=>{

    if(playerScreen.style.display === "flex"){

        if(
            e.key === "Backspace" ||
            e.key === "Escape"
        ){
            closeVideo();
        }

        return;
    }

    const cols = 4;

    if(e.key === "ArrowRight"){

        if(selectedIndex < videos.length - 1){
            selectedIndex++;
        }
    }

    if(e.key === "ArrowLeft"){

        if(selectedIndex > 0){
            selectedIndex--;
        }
    }

    if(e.key === "ArrowDown"){

        if(selectedIndex + cols < videos.length){
            selectedIndex += cols;
        }
    }

    if(e.key === "ArrowUp"){

        if(selectedIndex - cols >= 0){
            selectedIndex -= cols;
        }
    }

    if(e.key === "Enter"){

        if(document.activeElement.id !== "search"){
            openVideo();
        }
    }

    updateSelection();
});

loadTrending();

</script>

</body>
</html>
